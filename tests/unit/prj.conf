CONFIG_ZTEST=y
# Os testes do EKF chamam a localização inteira na thread do ztest.
CONFIG_ZTEST_STACK_SIZE=4096
# Mensagens de falha e resumos dos testes com %f.
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_RTLS_TWR_MATH=y
CONFIG_RTLS_PROTO=y
CONFIG_RTLS_LOC=y
CONFIG_RTLS_HOST_IF_CODEC=y
CONFIG_RTLS_CONFIG_REGISTRY=y
