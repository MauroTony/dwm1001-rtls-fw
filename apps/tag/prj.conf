# Tag: DS-TWR initiator + localização (EKF) + envio da posição ao gateway.

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_FPU=y
# Tempo de execução do EKF no resumo de 10 s (T4.9).
CONFIG_TIMING_FUNCTIONS=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
# O CSV (printk) passa pelo log diferido (CONFIG_LOG_PRINTK). Com o buffer
# padrão de 1 KB, um pico de linhas descarta as mais antigas; 4 KB dá folga.
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_MAIN_STACK_SIZE=4096

CONFIG_RTLS_STATUS_LED=y
CONFIG_RTLS_TWR=y
CONFIG_RTLS_LOC=y

# M8: parâmetros na NVS (settings), shell na UART e watchdog.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SHELL=y
CONFIG_REBOOT=y
CONFIG_WATCHDOG=y
# O CSV sai pelo backend de log do shell: filas maiores para não perder linhas.
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=64
CONFIG_RTLS_CONFIG=y
CONFIG_RTLS_WATCHDOG=y
